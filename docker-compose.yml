version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sis_cyber_fortress_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sis_secure_dev_password_2026
      POSTGRES_DB: sis_cyber_fortress
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sis_cyber_fortress_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: sis_cyber_fortress_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:sis_secure_dev_password_2026@postgres:5432/sis_cyber_fortress?schema=public
      JWT_SECRET: sis_cyber_fortress_super_secret_jwt_key_2026_change_in_production
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: sis_cyber_fortress_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
